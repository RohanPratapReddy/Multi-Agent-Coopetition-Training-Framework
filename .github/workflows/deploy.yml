name: Deploy

# Release pipeline for the `mactf` distribution.
#
#   push tag v1.0.0      -> test, build, publish to PyPI, verify install, GitHub release
#   push tag v1.1.0rc1   -> test, build, publish to TestPyPI only
#   push tag v0.1.0      -> first service/client release: PyPI
#   push tag v0.1.0rc1   -> pre-release: TestPyPI only
#   manual dispatch      -> test, build, then whatever `target` says
#
# Publishing uses OIDC Trusted Publishing, so no API token is stored in the repo.
# One-time setup is documented in .github/PUBLISHING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the built artifacts
        type: choice
        options:
          - build-only
          - testpypi
          - pypi
        default: build-only

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.12"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------
  # Decide where this run publishes, before spending time on the build.
  # ---------------------------------------------------------------------
  resolve:
    name: Resolve publish target
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Classify tag or dispatch input
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
          else
            python -m pip install --quiet packaging
            tag="${GITHUB_REF_NAME#v}"
            # 0.1.0 is a final release; rc/a/b/dev suffixes are pre-releases. Ask
            # packaging.version, which is what pip and PyPI use, not a regex.
            target="$(python - "$tag" <<'PY'
          import sys
          from packaging.version import InvalidVersion, Version

          try:
              version = Version(sys.argv[1])
          except InvalidVersion:
              print("invalid")
          else:
              print("testpypi" if version.is_prerelease or version.is_devrelease else "pypi")
          PY
          )"
            if [ "$target" = "invalid" ]; then
              echo "::error::tag $GITHUB_REF_NAME is not a PEP 440 version"
              exit 1
            fi
          fi
          echo "publish=$target" >> "$GITHUB_OUTPUT"
          echo "publish target: $target"

  # ---------------------------------------------------------------------
  # Test on every supported interpreter. CPU torch keeps the job small.
  # ---------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The sandbox and path code has real Windows branches (qemu WINDOWS,
          # local SYSTEMROOT passthrough) that the install smoke test does not reach.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU build first so pip does not pull the CUDA wheel.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Required checks that each protect one claim. They are separate jobs so a
  # failure says which claim broke.
  # ---------------------------------------------------------------------
  api-contract:
    name: API contract completeness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Contract tests
        run: >
          python -m pytest -q
          tests/contrib_api/test_contract_completeness.py
          tests/http/test_openapi.py
          tests/contrib_api/test_api_urls.py

  stdlib-only:
    name: Standard library only (no extras, no HTTP package)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
      - name: Build and install the wheel with no extras
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --no-deps dist/*.whl PyYAML
      - name: No third-party HTTP package is present
        run: |
          python - <<'PY'
          import importlib.util
          present = [m for m in ("fastapi", "uvicorn", "httpx", "requests", "pydantic", "starlette")
                     if importlib.util.find_spec(m)]
          assert not present, present
          PY
      - name: The transport and the client import without one
        run: |
          python -c "import mactf.http, mactf.client, sys; bad = {'fastapi','uvicorn','pydantic','httpx'} & set(sys.modules); assert not bad, bad"
      - name: The client does not import torch
        run: python -c "import mactf.client; import sys; assert 'torch' not in sys.modules"
      - name: The server starts
        env:
          MACTF_SETTINGS_MODULE: mactf.settings_default
        run: python -m mactf serve --help
      - name: Serve and handler tests against a wsgiref server
        run: |
          python -m pip install pytest
          python -m pytest -q tests/contrib_api/test_serve.py tests/http/test_handler.py

  numeric-equivalence:
    name: Numeric equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Equivalence gates
        run: >
          python -m pytest -q
          tests/scoring/test_pipeline_equivalence.py
          tests/rl/test_loss_functions.py
          tests/training/test_trainer_equivalence.py
          tests/hierarchy/test_flat_equivalence.py

  determinism:
    name: Determinism (PYTHONHASHSEED ${{ matrix.hashseed }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hashseed: ["0", "12345"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Determinism gates
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: >
          python -m pytest -q
          tests/hierarchy/test_inference_determinism.py
          tests/checkpoints/test_resume_bit_identical.py

  points-equivalence:
    name: Points equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: The rubric did not reach the docx numbers
        run: >
          python -m pytest -q
          tests/scoring/test_points_equivalence.py
          tests/scoring/test_points_monotone.py
          tests/scoring/test_normalize_invariants.py
          tests/scoring/test_points_non_interference.py

  points-parity:
    name: Points parity over a real server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Points routes, scorecard v2 and client parity
        run: >
          python -m pytest -q
          tests/contrib_api/test_points_routes.py
          tests/contrib_api/test_scorecard_v2.py
          tests/client/test_points_parity.py

  transport-parity:
    name: Transport parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Both transports agree and removing the app removes the API
        run: >
          python -m pytest -q
          tests/client/test_parity.py
          tests/client/test_from_dict.py
          tests/contrib_api/test_uninstalled.py

  conf-layout:
    name: conf/ layout equivalence and shipped templates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: A conf/ project is the project its settings.py used to be
        run: >
          python -m pytest -q
          tests/test_conf_files.py
          tests/test_conf_blocks.py
          tests/test_conf_equivalence.py
          tests/test_conf_consumers.py
          tests/test_startproject_conf.py
          tests/test_packaging.py

  # ---------------------------------------------------------------------
  # Build the wheel and sdist once, then hand them to every publish job.
  # ---------------------------------------------------------------------
  build:
    name: Build distributions
    needs:
      - resolve
      - test
      - api-contract
      - stdlib-only
      - numeric-equivalence
      - determinism
      - points-equivalence
      - points-parity
      - transport-parity
      - conf-layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet packaging
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import mactf; print(mactf.__version__)')"
          same="$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]) == Version(sys.argv[2]))' "$tag" "$version")"
          if [ "$same" != "True" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mactf.__version__ ($version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches mactf.__version__ $version"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Show artifact contents
        run: |
          python -c "import zipfile, glob; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = z.namelist(); print('wheel entries:', len(names)); print('templates:', sum(n.endswith('.tpl') for n in names)); print('py.typed:', 'mactf/py.typed' in names); [print(p, p + '/__init__.py' in names) for p in ('mactf/http','mactf/contrib/api','mactf/client','mactf/testing','mactf/data','mactf/distributed','mactf/training','mactf/rl/functions')]"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Pre-release path. TestPyPI cannot resolve `torch`, so the artifacts
  # there are for metadata inspection and pip resolver testing only.
  # ---------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mactf
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          # Re-running a release job should not fail on an already-uploaded file.
          skip-existing: true

  # ---------------------------------------------------------------------
  # Production path.
  # ---------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mactf
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  # ---------------------------------------------------------------------
  # Prove the published artifact is installable and usable from nothing.
  # ---------------------------------------------------------------------
  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: publish-pypi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "mactf[shell]"

      - name: Report version
        run: python -m mactf version

      - name: Run system checks
        run: python -m mactf check

      - name: Scaffold a project
        run: python -m mactf startproject smoke_project --dir .

      - name: Check the generated project
        working-directory: smoke_project
        run: python manage.py check

  # ---------------------------------------------------------------------
  # Attach the built artifacts to the tag so the release is self-contained.
  # ---------------------------------------------------------------------
  github-release:
    name: Create GitHub release
    needs: [resolve, build, publish-pypi]
    if: needs.resolve.outputs.publish == 'pypi' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
