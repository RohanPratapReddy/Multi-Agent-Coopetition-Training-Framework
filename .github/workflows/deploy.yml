name: Deploy

# Release pipeline for the `mactf` distribution.
#
#   push tag v1.0.0      -> test, build, publish to PyPI, verify install, GitHub release
#   push tag v1.1.0rc1   -> test, build, publish to TestPyPI only
#   manual dispatch      -> test, build, then whatever `target` says
#
# Publishing uses OIDC Trusted Publishing, so no API token is stored in the repo.
# One-time setup is documented in .github/PUBLISHING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the built artifacts
        type: choice
        options:
          - build-only
          - testpypi
          - pypi
        default: build-only

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.12"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------
  # Decide where this run publishes, before spending time on the build.
  # ---------------------------------------------------------------------
  resolve:
    name: Resolve publish target
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Classify tag or dispatch input
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
          else
            tag="${GITHUB_REF_NAME#v}"
            if printf '%s' "$tag" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
              target="pypi"
            else
              target="testpypi"
            fi
          fi
          echo "publish=$target" >> "$GITHUB_OUTPUT"
          echo "publish target: $target"

  # ---------------------------------------------------------------------
  # Test on every supported interpreter. CPU torch keeps the job small.
  # ---------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU build first so pip does not pull the CUDA wheel.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Build the wheel and sdist once, then hand them to every publish job.
  # ---------------------------------------------------------------------
  build:
    name: Build distributions
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import mactf; print(mactf.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mactf.__version__ ($version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches mactf.__version__ $version"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Show artifact contents
        run: |
          python -c "import zipfile, glob; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = z.namelist(); print('wheel entries:', len(names)); print('templates:', sum(n.endswith('.tpl') for n in names)); print('py.typed:', 'mactf/py.typed' in names)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Pre-release path. TestPyPI cannot resolve `torch`, so the artifacts
  # there are for metadata inspection and pip resolver testing only.
  # ---------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mactf
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          # Re-running a release job should not fail on an already-uploaded file.
          skip-existing: true

  # ---------------------------------------------------------------------
  # Production path.
  # ---------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mactf
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  # ---------------------------------------------------------------------
  # Prove the published artifact is installable and usable from nothing.
  # ---------------------------------------------------------------------
  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: publish-pypi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "mactf[shell]"

      - name: Report version
        run: python -m mactf version

      - name: Run system checks
        run: python -m mactf check

      - name: Scaffold a project
        run: python -m mactf startproject smoke_project --dir .

      - name: Check the generated project
        working-directory: smoke_project
        run: python manage.py check

  # ---------------------------------------------------------------------
  # Attach the built artifacts to the tag so the release is self-contained.
  # ---------------------------------------------------------------------
  github-release:
    name: Create GitHub release
    needs: [resolve, build, publish-pypi]
    if: needs.resolve.outputs.publish == 'pypi' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
